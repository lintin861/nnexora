<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">NNE logo</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13251e"/>
      <stop offset="1" stop-color="#080d0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6dffbf"/>
      <stop offset="1" stop-color="#00c878"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#background)" stroke="#00ff9d" stroke-opacity=".38" stroke-width="2"/>
  <text x="32" y="40" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" letter-spacing="-1.3" text-anchor="middle">NNE</text>
</svg>
