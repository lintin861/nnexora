<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexora - Activity</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="grid"></div>

        <span class="dot dot1"></span>
        <span class="dot dot2"></span>
        <span class="dot dot3"></span>
        <span class="dot dot4"></span>
        <span class="dot dot5"></span>
        <span class="dot dot6"></span>
        <span class="dot dot7"></span>
        <span class="dot dot8"></span>

        <div class="network-line line1"></div>
        <div class="network-line line2"></div>
        <div class="network-line line3"></div>
    </div>


    <main class="page-container">

        <!-- Header -->
        <header class="page-header">

            <div>
                <h1>Activity</h1>
                <p>Your complete transaction history</p>
            </div>

            <div class="realtime">
                <i class="fa-regular fa-clock"></i>
                Real-time
            </div>

        </header>


        <!-- Filters -->
        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="credit"
            >
                Credit
            </button>

            <button
                class="filter"
                data-filter="debit"
            >
                Debit
            </button>

        </div>


        <!-- Transactions -->
        <section class="activity-list" id="activityList">

            <div
                class="activity-item"
                data-type="credit"
            >

                <div class="activity-icon">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                </div>

                <div class="activity-info">
                    <strong>Surprise Bonus</strong>
                    <span>10/12/2026</span>
                </div>

                <strong class="credit-amount">
                    +₦10,000
                </strong>

            </div>


            <div
                class="activity-item"
                data-type="credit"
            >

                <div class="activity-icon">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                </div>

                <div class="activity-info">
                    <strong>Welcome Bonus</strong>
                    <span>10/12/2026</span>
                </div>

                <strong class="credit-amount">
                    +₦50,000
                </strong>

            </div>


            <div
                class="activity-item"
                data-type="debit"
            >

                <div class="activity-icon debit-icon">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                </div>

                <div class="activity-info">
                    <strong>Example Debit</strong>
                    <span>10/11/2026</span>
                </div>

                <strong class="debit-amount">
                    -₦5,000
                </strong>

            </div>

        </section>


        <!-- Empty state -->
        <div
            class="empty-state"
            id="emptyState"
        >
            <i class="fa-regular fa-folder-open"></i>
            <span>No transactions found</span>
        </div>


        <!-- Security -->
        <div class="security-message">

            <i class="fa-solid fa-shield-halved"></i>

            <span>
                All records are encrypted and secure
            </span>

        </div>

    </main>


    <!-- Bottom navigation -->
    <nav class="bottom-nav">

        <button
            class="nav-item"
            onclick="goTo('index.html')"
        >
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>


        <button
            class="nav-item active"
        >
            <i class="fa-solid fa-wave-square"></i>
            <span>Activity</span>
        </button>


        <button
            class="nav-item"
            onclick="goTo('earn.html')"
        >
            <i class="fa-solid fa-bolt"></i>
            <span>Earn</span>
        </button>


        <button
            class="nav-item"
            onclick="goTo('card.html')"
        >
            <i class="fa-regular fa-credit-card"></i>
            <span>Card</span>
        </button>


        <button
            class="nav-item"
            onclick="goTo('profile.html')"
        >
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </button>

    </nav>


    <script src="activity.js"></script>

</body>
</html>
